<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>두심병원</title>
  <link rel="stylesheet" href="/static/app.css?v=20260809-coordinates" />
</head>
<body>
  <header>
    <div class="brand-wrap">
      <img class="brand-logo" src="/static/dusim_logo.png" alt="두Sim 로고" />
    </div>
  </header>

  <main>
    <aside>
      <section>
        <h2>AMR 선택</h2>
        <div id="amrCards" class="cards"></div>
      </section>

      <section>
        <h2>환자 선택</h2>
        <div id="bedCards" class="cards"></div>
      </section>

      <section>
        <h2>환자 이송 시작</h2>
        <button id="startMissionBtn" class="primary wide section-button" type="button">이동 명령</button>
        
      </section>

    </aside>

    <section class="workspace">
      <div class="workspace-toolbar">
        <div class="floor-tabs">
          <button data-floor="1" class="floor-tab active" title="/world_pose x,y를 1층 좌표 기준으로 판정">1층</button>
          <button data-floor="2" class="floor-tab" title="/world_pose x,y를 2층 좌표 기준으로 판정">2층</button>
        </div>
        <div id="worldPoseIndicators" class="world-pose-indicators" aria-label="AMR별 world pose 수신 상태"></div>
      </div>

      <div class="map-layout single-panel">
        <div id="mapStage" class="map-stage">
          <div id="mapFloorLabel" class="map-floor-label" aria-label="현재 표시 지도 층">1층 MAP</div>
          <img id="mapImage" alt="병원 지도" />
          <div id="waypointLayer" class="waypoint-layer" aria-hidden="true"></div>
          <div id="amrLayer" class="amr-layer" aria-label="AMR 위치"></div>
        </div>

        <div class="side-panels">

          <section class="current-status-section side-panel-status-section">
            <h2>현재 상태</h2>
            <!-- 시나리오 진행 상태 -->
            <div class="status-box">
              <div class="status-head">
                <span id="currentStateBadge" class="state-pill">대기</span>
                <strong id="currentStateTitle">AMR·환자를 선택하세요.</strong>
              </div>
              <p id="currentStateDetail" class="status-detail">선택한 AMR의 현재 상태와 버튼 진행 상태를 여기에서 확인할 수 있습니다.</p>
            </div>
            <div id="scenarioProgress" class="scenario-progress single-current-step" aria-label="현재 실제 미션 상태"></div>

            <div id="patientInfo" class="patient-info"></div>
            <button id="scenarioActionBtn" class="primary wide section-button" type="button" disabled>현재 단계 대기</button>

            <p id="errorText" class="error" role="alert" aria-live="polite"></p>
          </section>




        </div>
      </div>

      <section class="log-panel">
        <div class="log-panel-head">
          <h2>이벤트 로그</h2>
          <button id="openLogModalBtn" class="secondary log-more-btn" type="button">과거 로그 보기</button>
        </div>
        <div id="eventLog"></div>
      </section>
    </section>
  </main>

  <div id="logModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="logModalTitle">
      <div class="modal-head">
        <h2 id="logModalTitle">전체 이벤트 로그</h2>
        <button id="closeLogModalBtn" class="secondary modal-close-btn" type="button">닫기</button>
      </div>
      <div id="eventLogAll" class="modal-log-list"></div>
    </div>
  </div>

  <script src="/static/app.js?v=20260809-scenario"></script>
</body>
</html>
