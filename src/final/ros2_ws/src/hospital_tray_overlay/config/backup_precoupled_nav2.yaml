pose_lock_localizer:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    odom_frame: coop_odom
    base_frame: cooperative_base_link
    broadcast_hz: 30.0
    auto_initial_pose: true
    initial_x: -22.69
    initial_y: 11.03
    initial_yaw: 0.0
centerline_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    base_frame: cooperative_base_link
    goal_topic: /coop/center_goal
    path_topic: /coop/centerline_path
    cmd_vel_topic: /coop/cmd_vel
    follow_path_action: /coopnav/follow_path
    downsample_factor: 2
    robot_safe_radius_m: 0.72
    goal_snap_radius_m: 2.5
    center_weight: 0.55
    turn_penalty: 2.5
    path_point_spacing_m: 0.1
    corner_stop_sec: 0.8
    final_stop_sec: 2.0
    rotate_before_segment: false
    rotate_max_speed_rad_s: 0.22
    rotate_min_speed_rad_s: 0.06
    rotate_kp: 0.9
    rotate_tolerance_rad: 0.04
    rotate_stable_cycles: 5
    retry_delay_sec: 0.8
    max_follow_path_retries: 0
    status_topic: /coop/center_goal/status
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: cooperative_base_link
    odom_topic: /coop/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 60.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.22
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      acc_lim_x: 0.45
      acc_lim_y: 0.0
      acc_lim_theta: 0.9
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -1.2
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.8
      linear_granularity: 0.04
      angular_granularity: 0.025
      transform_tolerance: 0.4
      xy_goal_tolerance: 0.18
      trans_stopped_velocity: 0.025
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.01
      PathAlign.scale: 42.0
      PathAlign.forward_point_distance: 0.18
      GoalAlign.scale: 28.0
      GoalAlign.forward_point_distance: 0.18
      PathDist.scale: 44.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 36.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: coop_odom
      robot_base_frame: cooperative_base_link
      use_sim_time: true
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: '[[-0.95, -0.72], [-0.95, 0.72], [0.95, 0.72], [0.95, -0.72]]'
      footprint_padding: 0.02
      plugins:
      - voxel_layer
      - inflation_layer
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: false
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0
        observation_sources: scan_left scan_right
        scan_left:
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 11.5
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
          topic: /coop/scan_left
        scan_right:
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 11.5
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
          topic: /coop/scan_right
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.4
        inflation_radius: 0.24
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: false
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: cooperative_base_link
      use_sim_time: true
      footprint: '[[-0.95, -0.72], [-0.95, 0.72], [0.95, 0.72], [0.95, -0.72]]'
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false
        observation_sources: scan_left scan_right
        scan_left:
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 11.5
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
          topic: /coop/scan_left
        scan_right:
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 11.5
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
          topic: /coop/scan_right
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.2
        inflation_radius: 0.35
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: coop_odom
    robot_base_frame: cooperative_base_link
    transform_tolerance: 0.4
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.9
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.30
    - 0.0
    - 0.22
    min_velocity:
    - 0.0
    - 0.0
    - -0.35
    max_accel:
    - 0.45
    - 0.0
    - 0.9
    max_decel:
    - -0.6
    - 0.0
    - -1.2
    odom_topic: /coop/odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.01
    - 0.0
    - 0.01
    velocity_timeout: 0.35
